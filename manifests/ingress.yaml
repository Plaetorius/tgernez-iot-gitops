---
# k3d maps host port 8888 to the cluster load balancer's port 80, which fronts
# Traefik. This Ingress is the last hop, so `curl http://localhost:8888/`
# reaches the pod with no port-forward process running.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playground
  namespace: dev
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: playground
                port:
                  number: 8888
